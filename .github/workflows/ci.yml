name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Use the runner's selected Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Swift and mock-server tests
        run: ./Scripts/test.sh
      - name: Build both science demo modes
        run: |
          npm install --global --force yarn@1.22.22
          for project in cosmic-archive mathematical-minds earth-observatory; do
            (cd "DemoApplications/$project" && yarn install --frozen-lockfile && yarn build && yarn build --mode live)
          done
  package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use the runner's selected Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Validate universal packaging
        env:
          MODE_RUNNER_PREVIEW: '1'
        run: ./Scripts/package-release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-preview
          path: |
            dist/*unsigned-preview.dmg
            dist/*.sha256
          retention-days: 7
